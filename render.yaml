services:
  - type: web
    name: cafetulia
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile=false && pnpm build
    startCommand: npx tsx server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        value: /var/data/cafetulia.sqlite
    disk:
      name: cafetulia-sqlite-data
      mountPath: /var/data
      sizeGB: 1
