name: Render keepalive

on:
  schedule:
    # Render Free duerme el servicio tras 15 minutos sin tráfico.
    # Este ping lo mantiene despierto para poder jugar cuando apetezca.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Cafetulia health endpoint
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL no configurada; se omite el ping."
            echo "Configúrala en Settings > Secrets and variables > Actions > Variables."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 5 --max-time 20 "$RENDER_URL/health"
